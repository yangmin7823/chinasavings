<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyTCN — Review Moderation</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--red:#dc2626;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f3f4f6;color:var(--ink);line-height:1.5;padding:24px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .card.pending{border-left:4px solid #f59e0b}
  .card.approved{border-left:4px solid #16a34a}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .name{font-weight:700}
  .country{color:var(--muted);font-size:13px}
  .stars{color:#f59e0b;font-size:14px;letter-spacing:1px}
  .when{color:var(--muted);font-size:12px;margin-left:auto}
  .text{font-size:14px;color:#374151;margin-bottom:10px;white-space:pre-wrap}
  .photo img{max-width:220px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px}
  .status-pill{font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px}
  .pill-pending{background:#fef3c7;color:#92400e}
  .pill-approved{background:#dcfce7;color:#166534}
  .actions{display:flex;gap:8px}
  .btn{border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .btn-approve{background:#16a34a;color:#fff}
  .btn-delete{background:#f3f4f6;color:#b91c1c}
  .login{border:1px solid var(--line);border-radius:14px;background:#fff;padding:28px;max-width:380px;margin:60px auto;text-align:center}
  .login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin:12px 0}
  .login .btn{width:100%;background:var(--red);color:#fff;padding:11px}
  .err{color:#b91c1c;font-size:13px;min-height:18px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .badge{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login" style="display:none">
    <div style="font-size:32px">🔐</div>
    <h1 style="font-size:18px;margin-top:8px">Review Moderation</h1>
    <input type="password" id="pw" placeholder="Admin password">
    <button class="btn" id="loginBtn">Unlock</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="main" style="display:none">
    <div class="bar">
      <div>
        <h1>⭐ BuyTCN Reviews</h1>
        <div class="sub">Approve or delete customer reviews. Approved reviews appear on buytcn.com.</div>
      </div>
      <div><button class="btn btn-delete" id="logoutBtn" style="border:1px solid var(--line)">Log out</button></div>
    </div>
    <div class="badge" id="statusLine"></div>
    <div id="list"></div>
  </div>
</div>

<script>
const API = '/api/reviews'
let token = sessionStorage.getItem('rvt') || ''
const login = document.getElementById('login')
const main = document.getElementById('main')
const listEl = document.getElementById('list')
const statusLine = document.getElementById('statusLine')

function stars(n){return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n)}
function when(ts){ const d=new Date(ts); return d.toISOString().slice(0,10)+' '+d.toISOString().slice(11,16)+' UTC' }
function pill(s){return s==='pending'?'<span class="status-pill pill-pending">PENDING</span>':'<span class="status-pill pill-approved">APPROVED</span>'}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function loadAll(){
  const res = await fetch(API + '?all=1&token=' + encodeURIComponent(token))
  const d = await res.json()
  if(!d.ok){ statusLine.textContent='Session expired — log in again.'; logout(); return }
  render(d.reviews||[])
}
function render(items){
  const pending = items.filter(r=>r.status==='pending')
  const approved = items.filter(r=>r.status==='approved')
  statusLine.textContent = pending.length + ' pending · ' + approved.length + ' approved'
  if(!items.length){ listEl.innerHTML='<div class="card"><div class="sub">No reviews yet. Share your review link with customers!</div></div>'; return }
  listEl.innerHTML = items.map(r=>`
    <div class="card ${r.status}">
      <div class="meta">
        <span class="name">${esc(r.name)}</span>
        <span class="country">${esc(r.country||'')}</span>
        <span class="stars">${stars(r.rating)}</span>
        <span class="when">${when(r.createdAt)}</span>
        <span>${pill(r.status)}</span>
      </div>
      ${r.photo?`<div class="photo"><img src="${r.photo}" alt=""></div>`:''}
      <div class="text">${esc(r.text)}</div>
      <div class="actions">
        ${r.status==='pending'?`<button class="btn btn-approve" onclick="act('approve','${r.id}')">✓ Approve</button>`:''}
        <button class="btn btn-delete" onclick="act('delete','${r.id}')">Delete</button>
      </div>
    </div>`).join('')
}
async function act(action,id){
  if(action==='delete' && !confirm('Delete this review?')) return
  const res = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id,token})})
  const d = await res.json()
  if(d.ok) loadAll(); else alert('Failed: '+(d.error||'unknown'))
}
async function tryLogin(){
  const v=document.getElementById('pw').value.trim()
  if(!v) return
  token = v
  const res = await fetch(API + '?all=1&token=' + encodeURIComponent(token))
  const d = await res.json()
  if(!d.ok){ token=''; document.getElementById('loginErr').textContent='Wrong password'; return }
  sessionStorage.setItem('rvt',v)
  showMain()
}
function showMain(){ login.style.display='none'; main.style.display='block'; loadAll() }
function logout(){ token=''; sessionStorage.removeItem('rvt'); login.style.display='block'; main.style.display='none' }
document.getElementById('loginBtn').onclick = tryLogin
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin() })
document.getElementById('logoutBtn').onclick = logout
if(token){ showMain() } else { login.style.display='block' }
</script>
</body>
</html>
